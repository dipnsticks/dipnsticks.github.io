<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin | DIP N’ STICKS</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--r:#c8171c;--y:#f1ab0a;--c:#f5f0e6;--k:#111;--w:#fff}*{box-sizing:border-box;margin:0}body{background:var(--c);font:15.5px/1.5 Barlow,Arial,sans-serif;color:var(--k)}
h1,h2,h3,.d{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;line-height:1.05}h2{color:var(--r);font-size:26px}h3{font-size:16px;letter-spacing:.04em;margin:0 0 8px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}#sb{background:var(--r);color:var(--c);position:sticky;top:0;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.lg{font:700 24px Oswald;padding:0 10px 14px;line-height:1}.lg b{color:var(--y);display:block}.lg small{font:500 12px Oswald;letter-spacing:.16em;color:var(--c);opacity:.8}
#sb button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--c);font:500 16px Oswald;text-transform:uppercase;letter-spacing:.05em;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left;position:relative}
#sb button:hover{background:rgba(0,0,0,.18)}#sb button.on{background:var(--y);color:var(--k)}#sb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#sb i{margin-left:auto;background:var(--k);color:var(--y);border-radius:12px;font:700 12px Oswald;padding:1px 8px;font-style:normal}#sb .sp{flex:1}#sb a{color:var(--y);font:500 14px Oswald;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;text-decoration:none}
.mn{min-width:0}.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:2px solid var(--k);background:var(--c);position:sticky;top:0;z-index:5}.top h2{margin:0}.top .sp{flex:1}
main{padding:22px 26px 110px;max-width:1100px}.card{background:var(--w);border:2px solid var(--k);border-radius:16px;padding:16px;margin-bottom:14px}.card.hl{border-color:var(--r)}
input,textarea,select{font:inherit;width:100%;padding:9px 12px;border:2px solid var(--k);border-radius:10px;background:var(--w);margin-bottom:8px;min-width:0}textarea{min-height:84px}input[type=checkbox]{width:auto;margin:0;accent-color:var(--r);transform:scale(1.25)}
input:focus,textarea:focus,select:focus{outline:3px solid var(--y)}label.m,.m{color:#555;font-size:13.5px}label.m{display:block;margin:2px 0 3px;font-weight:600}
.b{font:700 14px Oswald;text-transform:uppercase;letter-spacing:.05em;background:var(--r);color:#fff;border:2px solid var(--r);border-radius:30px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-block}.b.o{background:none;color:var(--r)}.b.y{background:var(--y);border-color:var(--y);color:var(--k)}.b.k{background:var(--k);border-color:var(--k);color:var(--y)}.b.s{padding:4px 12px;font-size:12.5px}.b:disabled{opacity:.5}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}.kp{cursor:pointer}.kp .n{font:700 40px Oswald;color:var(--r);line-height:1}.kp.y{background:var(--y)}.kp.y .n{color:var(--k)}.tr{font-weight:700;font-size:13px}.tr.up{color:#111}.tr.dn{color:var(--r)}
.two{display:grid;gap:14px;grid-template-columns:1.6fr 1fr}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{margin-bottom:0}.row.f>input,.row.f>select{flex:1;min-width:120px}.sp{flex:1}
.st{color:var(--y);-webkit-text-stroke:1px var(--k);letter-spacing:2px;font-size:17px}.tag{display:inline-block;font:700 11.5px Oswald;letter-spacing:.1em;padding:2px 10px;border-radius:20px;background:var(--y);text-transform:uppercase}.tag.approved{background:var(--k);color:var(--y)}.tag.rejected{background:var(--r);color:#fff}
.pill{font:500 14px Oswald;text-transform:uppercase;border:2px solid var(--r);color:var(--r);background:none;border-radius:30px;padding:4px 14px;cursor:pointer}.pill.on{background:var(--r);color:#fff}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}.bar div{height:12px;background:var(--r);border-radius:6px;min-width:3px}.feed{list-style:none}.feed li{padding:8px 0;border-bottom:1px dotted #0004;display:flex;gap:10px}.feed small{color:#666;margin-left:auto;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--y);border:2px solid var(--k);margin-top:6px;flex:none}.dot.message{background:var(--r)}.dot.subscriber{background:var(--k)}
.cat{border:2px solid var(--k);border-radius:16px;padding:14px;margin-bottom:14px;background:var(--w)}.cat img{width:46px;height:46px;background:var(--c);border-radius:50%;padding:5px;border:2px solid var(--k);flex:none}
.it{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:center;margin-bottom:6px}.it input{margin:0}.it label{font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center}.ic{background:none;border:2px solid var(--k);border-radius:8px;width:32px;height:32px;cursor:pointer;font-weight:700}.ic.x{border-color:var(--r);color:var(--r)}
.of{display:grid;grid-template-columns:1.2fr 2fr 90px 140px auto auto;gap:8px;align-items:center;margin-bottom:6px}.of input{margin:0}
#sv{position:fixed;left:230px;right:0;bottom:0;background:var(--k);color:var(--y);padding:12px 26px;display:flex;gap:12px;align-items:center;z-index:9;font-weight:600}
#tt{position:fixed;top:16px;right:16px;z-index:20;background:var(--k);color:var(--y);border:2px solid var(--y);border-radius:12px;padding:10px 18px;font-weight:600;transition:.25s;transform:translateY(-90px)}#tt.on{transform:none}#tt.e{background:var(--r);color:#fff;border-color:#fff}
#login{min-height:100vh;display:grid;place-items:center;background:var(--r);padding:16px}#login .card{max-width:380px;width:100%;text-align:center;padding:30px}#login h1{font-size:34px;color:var(--r)}#login h1 b{color:var(--y);-webkit-text-stroke:1px var(--k)}.err{color:var(--r);font-weight:600;min-height:22px}
@media(max-width:860px){#app{grid-template-columns:1fr}#sb{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:6px;gap:2px;z-index:15;border-top:3px solid var(--y)}.lg,#sb .sp,#sb a{display:none}#sb button{flex:none;flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}#sb i{position:absolute;top:0;right:2px;margin:0}
 main{padding:16px 14px 150px}.top{padding:12px 14px}.two{grid-template-columns:1fr}#sv{left:0;bottom:62px;padding:10px 14px}.it{grid-template-columns:1fr 90px auto}.it .ic{display:none}.of{grid-template-columns:1fr 1fr}.of input:nth-child(2){grid-column:1/-1}}
</style></head><body>
<div id="app" hidden><aside id="sb"></aside><div class="mn"><div class="top"><h2 id="ttl"></h2><span class="sp"></span><a class="b o s" href="/" target="_blank">View site ↗</a><button class="b k s" id="lo">Log out</button></div><main id="main"></main></div></div>
<div id="sv" hidden><span>Unsaved changes</span><span class="sp"></span><button class="b o s" style="background:none;color:var(--y);border-color:var(--y)" onclick="go(T,1)">Discard</button><button class="b y s" onclick="D.save&&D.save()">Save changes</button></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T='dash';const D={dirty:0,rf:'pending',rs:'',rq:'',sel:new Set()};
const ARTS=['corn-dog','fries','croquettes','nuggets','twister','dip','can'];
const TABS=[['dash','Dashboard','M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z'],['reviews','Reviews','M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z'],['messages','Messages','M3 5h18v14H3zM3 6l9 7 9-7'],['menu','Menu','M5 4h14M5 9h14M5 14h14M5 19h9'],['offers','Offers','M3 12l9-9h8v8l-9 9zM16 8h.01'],['soon','Coming soon','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2'],['subs','Subscribers','M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 20a8 8 0 0 1 16 0'],['settings','Settings','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2'],['log','Activity','M5 4h14v16H5zM9 9h6M9 13h6M9 17h3']];
async function api(p,m,b){const r=await fetch('/api/admin/'+p,{method:m||'GET',headers:{'Content-Type':'application/json','x-requested-with':'dns'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status==401){show(0);throw new Error('login')}if(!r.ok)throw new Error(j.error||'Error');return j}
function toast(t,e){const o=$('#tt');o.textContent=t;o.className='on'+(e?' e':'');clearTimeout(toast.t);toast.t=setTimeout(()=>o.className='',2800)}
const fail=e=>{if(e.message!='login')toast(e.message,1)};
const show=a=>{if(a)$('#app').hidden=false;else location.replace('/admin/login')};
const fd=d=>new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const stars=n=>'<span class="st">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</span>';
function dirty(v,fn){D.dirty=v;if(fn)D.save=fn;$('#sv').hidden=!v}
addEventListener('beforeunload',e=>{if(D.dirty){e.preventDefault();e.returnValue=''}});
$('#lo').onclick=async()=>{try{await api('logout','POST')}catch(e){}show(0)};
$('#main').addEventListener('input',e=>{if(D.save&&e.target.closest('[data-edit]'))dirty(1)});$('#main').addEventListener('change',e=>{if(D.save&&e.target.closest('[data-edit]'))dirty(1)});
async function init(){try{await api('me');show(1);D.stats=await api('stats');go(T,1)}catch(e){show(0)}}
function nav(){const s=D.stats||{};$('#sb').innerHTML='<div class="lg">DIP N’<b>STICKS</b><small>Admin panel</small></div>'+TABS.map(t=>{const n=t[0]=='reviews'?s.reviews&&s.reviews.pending:t[0]=='messages'?s.messages&&s.messages.unread:0;return `<button class="${t[0]==T?'on':''}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24"><path d="${t[2]}"/></svg>${t[1]}${n?'<i>'+n+'</i>':''}</button>`}).join('')+'<span class="sp"></span><a href="/" target="_blank">← Back to website</a>'}
async function go(t,force){if(D.dirty&&!force&&!confirm('You have unsaved changes. Leave without saving?'))return;dirty(0);D.save=null;T=t;nav();$('#ttl').textContent=TABS.find(x=>x[0]==t)[1];$('#main').innerHTML='<p class="m">Loading…</p>';try{await V[t]()}catch(e){fail(e)}scrollTo(0,0)}
async function refreshStats(){D.stats=await api('stats');nav()}
const V={
async dash(){const s=await api('stats');D.stats=s;nav();const mx=Math.max(1,...s.days.map(d=>d[1])),W=700,H=150,bw=W/14,tr=s.prev?Math.round((s.week-s.prev)/s.prev*100):null,dm=Math.max(1,...s.dist);
const chart=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%">${s.days.map((d,i)=>{const h=d[1]/mx*H;return `<rect x="${i*bw+6}" y="${H-h}" width="${bw-12}" height="${Math.max(h,3)}" rx="5" fill="${i>=7?'#c8171c':'#f1ab0a'}" stroke="#111" stroke-width="1.5"><title>${d[0]}: ${d[1]} views</title></rect><text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle" font-size="12" fill="#555">${d[0].slice(8)}</text>`}).join('')}</svg>`;
$('#main').innerHTML=`<div class="g"><div class="card kp y" onclick="go('reviews')"><div class="n">${s.reviews.pending}</div><div>Reviews to approve</div></div><div class="card kp" onclick="go('messages')"><div class="n">${s.messages.unread}</div><div>Unread messages</div></div><div class="card kp"><div class="n">${s.week}</div><div>Page views (7 days)</div>${tr===null?'':`<div class="tr ${tr>=0?'up':'dn'}">${tr>=0?'▲':'▼'} ${Math.abs(tr)}% vs previous week</div>`}</div><div class="card kp"><div class="n">${s.reviews.avg||'–'}★</div><div>${s.reviews.approved} public reviews</div></div><div class="card kp" onclick="go('subs')"><div class="n">${s.subscribers}</div><div>Subscribers</div></div></div>
<div class="two"><div class="card"><h3>Page views — last 14 days <span class="m">(yellow = earlier week, red = this week)</span></h3>${chart}</div><div class="card"><h3>Rating breakdown</h3>${[5,4,3,2,1].map(n=>`<div class="bar"><span style="width:28px">${n}★</span><div style="width:${s.dist[n-1]/dm*100}%"></div><span>${s.dist[n-1]}</span></div>`).join('')}<h3 style="margin-top:14px">Top pages</h3>${s.top.map(t=>`<div class="bar"><span style="width:90px;text-transform:capitalize">${esc(t[0])}</span><div style="width:${t[1]/s.top[0][1]*100}px"></div><span>${t[1]}</span></div>`).join('')||'<p class="m">No visits yet.</p>'}</div></div>
<div class="two"><div class="card"><h3>Recent activity</h3><ul class="feed">${s.activity.map(a=>`<li><span class="dot ${a.k}"></span><span>${esc(a.s)}</span><small>${fd(a.t)}</small></li>`).join('')||'<li class="m">Nothing yet — activity appears here.</li>'}</ul></div>
<div class="card"><h3>Quick actions</h3><div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><button class="b" onclick="go('reviews')">Moderate reviews</button><button class="b y" onclick="go('menu')">Edit menu &amp; prices</button><button class="b y" onclick="go('settings')">Announcement / closure</button><a class="b o" href="/api/admin/backup">Download backup</a></div></div></div>`},
async reviews(){D.rv=await api('reviews');D.sel=new Set();const c=x=>D.rv.filter(r=>r.status==x).length;
$('#main').innerHTML=`<div class="card"><div class="row f"><input id="rq" placeholder="Search reviews…" value="${esc(D.rq)}" oninput="D.rq=this.value;rlist()"><select id="rs" onchange="D.rs=this.value;rlist()"><option value="">All ratings</option>${[5,4,3,2,1].map(n=>`<option value="${n}"${D.rs==n?' selected':''}>${n} stars</option>`).join('')}</select></div><div class="row" style="margin-top:10px">${['pending','approved','rejected','all'].map(x=>`<button class="pill ${x==D.rf?'on':''}" onclick="D.rf='${x}';V.reviews()">${x} ${x=='all'?D.rv.length:c(x)}</button>`).join('')}<span class="sp"></span><button class="b s y" onclick="$('#addr').hidden=!$('#addr').hidden">+ Add review</button></div>
<div id="addr" hidden style="margin-top:12px;border-top:1px dotted #0006;padding-top:12px"><div class="row f"><input id="an" placeholder="Customer name" maxlength="40"><select id="as">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} stars</option>`).join('')}</select></div><textarea id="at" placeholder="Review text" maxlength="500" style="margin-top:8px"></textarea><button class="b s" onclick="radd()">Publish review</button></div></div>
<div class="row" id="bulk" style="margin-bottom:12px" hidden><b id="bc"></b><button class="b s" onclick="bulk('approved')">Approve</button><button class="b s o" onclick="bulk('rejected')">Reject</button><button class="b s o" onclick="bulk('delete')">Delete</button></div><div id="rl"></div>`;rlist()},
async messages(){D.ms=await api('messages');$('#main').innerHTML=`<div class="card row f"><input id="mq" placeholder="Search messages…" oninput="D.mq=this.value;mlist()" value="${esc(D.mq||'')}"><select onchange="D.mf=this.value;mlist()"><option value="">All</option><option value="u"${D.mf=='u'?' selected':''}>Unread</option></select><button class="b s y" onclick="api('messages/readall','POST').then(()=>{toast('All marked read');refreshStats();V.messages()})">Mark all read</button></div><div id="ml"></div>`;mlist()},
async menu(){D.m=await api('menu');mrender()},
async offers(){D.o=await api('offers');orender()},
async soon(){D.sn=await api('soon');srender()},
async subs(){D.sb=await api('subscribers');$('#main').innerHTML=`<div class="card row f"><input placeholder="Search emails…" oninput="D.sq=this.value;sblist()"><button class="b s y" onclick="navigator.clipboard.writeText(D.sb.map(s=>s.email).join(', ')).then(()=>toast('Copied '+D.sb.length+' emails'))">Copy all emails</button><a class="b s" href="/api/admin/subscribers.csv">Download CSV</a></div><div id="sbl"></div>`;sblist()},
async settings(){D.s=await api('settings');D.s.social=D.s.social||{};while((D.s.hours=D.s.hours||[]).length<7)D.s.hours.push(['Day','']);const s=D.s,f=(k,l,ph)=>`<label class="m">${l}</label><input value="${esc(s[k])}" oninput="D.s.${k}=this.value" placeholder="${ph||''}">`,so=(k,l)=>`<label class="m">${l}</label><input value="${esc(s.social[k])}" oninput="D.s.social.${k}=this.value" placeholder="https://">`;
$('#main').innerHTML=`<div data-edit><div class="card${s.closed?' hl':''}"><h3>Announcement &amp; temporary closure</h3>${f('announcement','Announcement bar (top of every page — leave empty to hide)','e.g. New product launching Friday!')}<label class="row" style="margin:8px 0"><input type="checkbox" ${s.closed?'checked':''} onchange="D.s.closed=this.checked"> <b>Temporarily closed</b> <span class="m">— shows the message below on every page instead</span></label>${f('closedMsg','Closure message','We are closed today. See you soon!')}</div>
<div class="card"><h3>Business info</h3>${f('phone','Phone')}${f('whatsapp','WhatsApp link','https://wa.me/923235952364')}${f('address','Street address (optional)')}${f('maps','Get Directions link','https://www.google.com/maps/…')}${f('reviewUrl','External review link (optional)')}</div>
<div class="card"><h3>Opening hours</h3>${s.hours.map((h,i)=>`<div class="row f" style="margin-bottom:6px"><input style="max-width:140px" value="${esc(h[0])}" oninput="D.s.hours[${i}][0]=this.value"><input value="${esc(h[1])}" oninput="D.s.hours[${i}][1]=this.value" placeholder="e.g. 1–10 PM"><button class="b s o" onclick="D.s.hours[${i}][1]='Closed';this.previousElementSibling.value='Closed'">Closed</button></div>`).join('')}</div>
<div class="card"><h3>Social media</h3>${so('instagram','Instagram')}${so('facebook','Facebook')}${so('tiktok','TikTok')}</div></div>
<div class="card"><h3>Security</h3><div class="row f"><input id="p1" type="password" placeholder="Current password"><input id="p2" type="password" placeholder="New password (8+ characters)"><button class="b y s" onclick="pwsave()">Change password</button></div><p style="margin-top:10px"><button class="b o s" onclick="if(confirm('Log out every device?'))api('logout-all','POST').then(()=>show(0))">Log out everywhere</button></p></div>
<div class="card"><h3>Backup &amp; restore</h3><div class="row"><a class="b s" href="/api/admin/backup">Download backup</a><label class="b s o">Restore from backup…<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div><p class="m" style="margin-top:6px">Restoring replaces menu, offers, settings, reviews, messages and subscribers.</p></div>`;dirty(0,setsave)},
async log(){const l=await api('log');$('#main').innerHTML='<div class="card"><ul class="feed">'+(l.map(x=>`<li><span class="dot"></span><span>${esc(x.a)}</span><small>${fd(x.t)}</small></li>`).join('')||'<li class="m">No admin activity yet.</li>')+'</ul></div>'}};
/* reviews */
function rlist(){const q=D.rq.toLowerCase();const l=D.rv.filter(r=>(D.rf=='all'||r.status==D.rf)&&(!D.rs||r.stars==D.rs)&&(!q||(r.name+r.text).toLowerCase().includes(q)));
$('#rl').innerHTML=l.map(r=>`<div class="card"><div class="row"><input type="checkbox" ${D.sel.has(r.id)?'checked':''} onchange="sel('${r.id}',this.checked)">${stars(r.stars)}<span class="tag ${r.status}">${r.status}</span><span class="sp"></span><span class="m">${fd(r.date)}</span></div><p style="margin:6px 0"><b>${esc(r.name)}</b></p><p>${esc(r.text)}</p><input id="rp${r.id}" style="margin-top:8px" placeholder="Public reply from DIP N’ STICKS (optional)" maxlength="300" value="${esc(r.reply)}"><div class="row"><button class="b s" onclick="rv('${r.id}','approved')">Approve</button><button class="b s o" onclick="rv('${r.id}','rejected')">Reject</button><button class="b s y" onclick="rv('${r.id}')">Save reply</button><span class="sp"></span><button class="b s o" onclick="rdel('${r.id}')">Delete</button></div></div>`).join('')||'<p class="m">Nothing here.</p>';bsel()}
function sel(id,on){on?D.sel.add(id):D.sel.delete(id);bsel()}
function bsel(){$('#bulk').hidden=!D.sel.size;$('#bc').textContent=D.sel.size+' selected'}
async function rv(id,status){try{const b={reply:$('#rp'+id).value};if(status)b.status=status;await api('reviews/'+id,'PATCH',b);toast('Saved');await V.reviews();refreshStats()}catch(e){fail(e)}}
async function rdel(id){if(!confirm('Delete this review permanently?'))return;try{await api('reviews/'+id,'DELETE');toast('Deleted');await V.reviews();refreshStats()}catch(e){fail(e)}}
async function bulk(a){if(a=='delete'&&!confirm('Delete selected reviews?'))return;try{await api('reviews/bulk','POST',{ids:[...D.sel],action:a});toast('Done');await V.reviews();refreshStats()}catch(e){fail(e)}}
async function radd(){try{await api('reviews','POST',{name:$('#an').value,stars:$('#as').value,text:$('#at').value});toast('Review published');D.rf='approved';await V.reviews();refreshStats()}catch(e){fail(e)}}
/* messages */
function mlist(){const q=(D.mq||'').toLowerCase(),l=D.ms.filter(m=>(!D.mf||!m.read)&&(!q||(m.name+m.email+m.message).toLowerCase().includes(q)));
$('#ml').innerHTML=l.map(m=>`<div class="card${m.read?'':' hl'}"><div class="row"><b>${esc(m.name)}</b><a href="mailto:${esc(m.email)}">${esc(m.email)}</a>${m.read?'':'<span class="tag">New</span>'}<span class="sp"></span><span class="m">${fd(m.date)}</span></div><p style="margin:8px 0;white-space:pre-wrap">${esc(m.message)}</p><div class="row"><a class="b s" href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Re: your message to DIP N’ STICKS')}">Reply by email</a><button class="b s o" onclick="mk('${m.id}',${!m.read})">${m.read?'Mark unread':'Mark read'}</button><span class="sp"></span><button class="b s o" onclick="mdel('${m.id}')">Delete</button></div></div>`).join('')||'<p class="m">No messages.</p>'}
async function mk(id,r){try{await api('messages/'+id,'PATCH',{read:r});await V.messages();refreshStats()}catch(e){fail(e)}}
async function mdel(id){if(!confirm('Delete this message?'))return;try{await api('messages/'+id,'DELETE');await V.messages();refreshStats()}catch(e){fail(e)}}
/* menu */
function mrender(){$('#main').innerHTML=`<p class="m" style="margin-bottom:12px">Edit categories and prices — the website updates as soon as you save. Tick “Sold out” to strike an item through.</p><div data-edit id="ed">${D.m.map((c,i)=>`<div class="cat"><div class="row" style="margin-bottom:8px"><img src="/assets/images/products/${esc(c.art)}.png" alt=""><input style="flex:2;margin:0" placeholder="Category name" value="${esc(c.label)}" oninput="D.m[${i}].label=this.value;D.m[${i}].short=D.m[${i}].short||this.value"><select style="flex:1;margin:0" onchange="D.m[${i}].art=this.value;this.parentNode.querySelector('img').src='/assets/images/products/'+this.value+'.png'">${ARTS.map(a=>`<option${a==c.art?' selected':''}>${a}</option>`).join('')}</select><button class="ic" onclick="mv(${i},-1)">↑</button><button class="ic" onclick="mv(${i},1)">↓</button><button class="ic x" onclick="if(confirm('Remove this category?')){D.m.splice(${i},1);mrender();dirty(1,msave)}">×</button></div><input placeholder="Short tagline (shown on the menu page)" value="${esc(c.note)}" oninput="D.m[${i}].note=this.value">${c.items.map((x,j)=>`<div class="it"><input placeholder="Item name (empty = single price)" value="${esc(x[0])}" oninput="D.m[${i}].items[${j}][0]=this.value"><input type="number" min="0" placeholder="Price" value="${esc(x[1])}" oninput="D.m[${i}].items[${j}][1]=this.value"><label><input type="checkbox" ${x[2]?'checked':''} onchange="D.m[${i}].items[${j}][2]=this.checked"> Sold out</label><span><button class="ic" onclick="im(${i},${j},-1)">↑</button> <button class="ic x" onclick="D.m[${i}].items.splice(${j},1);mrender();dirty(1,msave)">×</button></span></div>`).join('')}<button class="b s o" onclick="D.m[${i}].items.push(['','']);mrender();dirty(1,msave)">+ Add item</button></div>`).join('')}</div><button class="b o" onclick="D.m.push({label:'',short:'',art:'corn-dog',note:'',items:[['','']]});mrender();dirty(1,msave)">+ Add category</button>`;D.save=msave}
function mv(i,d){const j=i+d;if(j<0||j>=D.m.length)return;[D.m[i],D.m[j]]=[D.m[j],D.m[i]];mrender();dirty(1,msave)}
function im(i,j,d){const a=D.m[i].items,k=j+d;if(k<0||k>=a.length)return;[a[j],a[k]]=[a[k],a[j]];mrender();dirty(1,msave)}
async function msave(){try{await api('menu','PUT',{data:D.m});toast('Menu saved — live on the website');dirty(0);D.m=await api('menu');mrender()}catch(e){fail(e)}}
/* offers */
function orender(){$('#main').innerHTML=`<p class="m" style="margin-bottom:12px">Add deals under each type. Offers can expire automatically on a date, or be switched off. Types with no active offers show “coming soon”.</p><div data-edit>${D.o.map((t,i)=>`<div class="cat"><div class="row" style="margin-bottom:8px"><input style="flex:1;margin:0" placeholder="Offer type (e.g. Combo Deals)" value="${esc(t.type)}" oninput="D.o[${i}].type=this.value"><button class="ic x" onclick="if(confirm('Remove this type?')){D.o.splice(${i},1);orender();dirty(1,osave)}">×</button></div>${t.items.map((x,j)=>`<div class="of"><input placeholder="Title" value="${esc(x.title)}" oninput="D.o[${i}].items[${j}].title=this.value"><input placeholder="Description" value="${esc(x.text)}" oninput="D.o[${i}].items[${j}].text=this.value"><input placeholder="Badge" value="${esc(x.badge)}" oninput="D.o[${i}].items[${j}].badge=this.value"><input type="date" title="Auto-hide after this date" value="${esc(x.until)}" onchange="D.o[${i}].items[${j}].until=this.value"><label class="m" style="display:flex;gap:4px;align-items:center"><input type="checkbox" ${x.active!==false?'checked':''} onchange="D.o[${i}].items[${j}].active=this.checked"> On</label><button class="ic x" onclick="D.o[${i}].items.splice(${j},1);orender();dirty(1,osave)">×</button></div>`).join('')}<button class="b s o" onclick="D.o[${i}].items.push({title:'',text:'',badge:'',until:'',active:true});orender();dirty(1,osave)">+ Add offer</button></div>`).join('')}</div><button class="b o" onclick="D.o.push({type:'',items:[]});orender();dirty(1,osave)">+ Add offer type</button>`;D.save=osave}
async function osave(){try{await api('offers','PUT',{data:D.o});toast('Offers saved');dirty(0);D.o=await api('offers');orender()}catch(e){fail(e)}}
/* coming soon */
function srender(){$('#main').innerHTML=`<p class="m" style="margin-bottom:12px">Upcoming products are shown as “Coming soon” — never as available.</p><div data-edit>${D.sn.map((p,i)=>`<div class="card row f"><input placeholder="Product name" value="${esc(p.name)}" oninput="D.sn[${i}].name=this.value"><input style="flex:2" placeholder="Short description" value="${esc(p.text)}" oninput="D.sn[${i}].text=this.value"><button class="ic x" onclick="D.sn.splice(${i},1);srender();dirty(1,ssave)">×</button></div>`).join('')}</div><button class="b o" onclick="D.sn.push({name:'',text:''});srender();dirty(1,ssave)">+ Add product</button>`;D.save=ssave}
async function ssave(){try{await api('soon','PUT',{data:D.sn});toast('Saved');dirty(0)}catch(e){fail(e)}}
/* subscribers / settings */
function sblist(){const q=(D.sq||'').toLowerCase();$('#sbl').innerHTML=D.sb.filter(s=>s.email.includes(q)).map(s=>`<div class="card row"><span>${esc(s.email)}</span><span class="m">${fd(s.date)}</span><span class="sp"></span><button class="b s o" onclick="sbdel('${s.id}')">Remove</button></div>`).join('')||'<p class="m">No subscribers yet.</p>'}
async function sbdel(id){if(!confirm('Remove this subscriber?'))return;try{await api('subscribers/'+id,'DELETE');await V.subs();refreshStats()}catch(e){fail(e)}}
async function setsave(){try{await api('settings','PUT',{data:D.s});toast('Settings saved — live on the website');dirty(0)}catch(e){fail(e)}}
async function pwsave(){try{await api('password','POST',{current:$('#p1').value,next:$('#p2').value});$('#p1').value=$('#p2').value='';toast('Password changed')}catch(e){fail(e)}}
async function restore(f){if(!f||!confirm('Replace current data with this backup?'))return;try{await api('restore','POST',{data:JSON.parse(await f.text())});toast('Backup restored');go('dash',1)}catch(e){fail(e)}}
init();
</script></body></html>
